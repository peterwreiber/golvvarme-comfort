# Publishes the approximate number of installations for the add-on's footer (community.py).
# GitHub counts unique cloners of this repository over 14 days; Home Assistant clones the add-on
# repository when it installs and checks for updates. Nothing is sent from the installations.
#
# Needs the repository secret STATS_TOKEN: a fine-grained token for this repository with
# "Administration: Read-only" (GitHub's traffic API requires it; the built-in token cannot read it).
name: Installationsstatistik

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Läs GitHubs klonstatistik och publicera anvandare.json
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$STATS_TOKEN" ]; then echo "::error::Hemligheten STATS_TOKEN saknas"; exit 1; fi
          clones=$(curl -fsSL -H "Authorization: Bearer $STATS_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/clones")
          uniques=$(jq -er '.uniques' <<<"$clones")
          mkdir out && cd out
          jq -n --argjson n "$uniques" --arg d "$(date -u +%F)" '{installations_14d: $n, updated: $d}' > anvandare.json
          cat anvandare.json
          git init -q -b stats
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add anvandare.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Installationsstatistik $(date -u +%F)"
          git push -q --force "https://x-access-token:${PUSH_TOKEN}@github.com/$REPO.git" stats
